name: Daily Price Scraper

on:
  schedule:
    
  workflow_dispatch:         # manual trigger from GitHub UI or button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q playwright beautifulsoup4 requests lxml
          .venv/bin/playwright install chromium

      - name: Run scraper
        run: .venv/bin/python daily_scraper.py
        continue-on-error: true   # don't fail the whole job if scraping is blocked

      - name: Commit updated tracker_data.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker_data.js
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
