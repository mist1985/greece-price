name: Daily Price Scraper

on:
  schedule:
    - cron: '0 7 * * *'    # 9:00 AM CET
    - cron: '0 13 * * *'   # 3:00 PM CET
    - cron: '0 19 * * *'   # 9:00 PM CET
  workflow_dispatch:         # manual trigger from GitHub UI or button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run scraper
        run: .venv/bin/python daily_scraper.py
        continue-on-error: true   # don't fail the whole job if scraping is blocked

      - name: Commit updated tracker_data.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker_data.js
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
