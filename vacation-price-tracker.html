<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greece Vacation Price Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .trip-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .trip-info h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input, select, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .add-listing {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #10b981;
        }

        .add-listing h2 {
            color: #10b981;
            margin-bottom: 15px;
        }

        .listing-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s;
        }

        .listing-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .listing-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .listing-platform {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .platform-airbnb {
            background: #ff5a5f;
            color: white;
        }

        .platform-booking {
            background: #003580;
            color: white;
        }

        .listing-details {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .listing-url {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            word-break: break-all;
        }

        .listing-url:hover {
            text-decoration: underline;
        }

        .price-history {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .price-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 5px;
        }

        .price-value {
            font-weight: 600;
            font-size: 1.1em;
            color: #667eea;
        }

        .price-change {
            font-size: 0.9em;
            font-weight: 600;
        }

        .price-up {
            color: #ef4444;
        }

        .price-down {
            color: #10b981;
        }

        .price-same {
            color: #666;
        }

        .add-price-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .add-price-form input {
            flex: 1;
        }

        .add-price-form button {
            background: #10b981;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .add-price-form button:hover {
            background: #059669;
        }

        .listing-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .chart-container {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .budget-summary {
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .budget-summary h2 {
            color: #10b981;
            margin-bottom: 15px;
        }

        .budget-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .budget-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .budget-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .budget-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #10b981;
        }

        .over-budget .budget-value {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state img {
            width: 100px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ Greece Vacation Price Tracker</h1>
        <p class="subtitle">Track prices for your dream summer vacation in Greece</p>

        <!-- Trip Information -->
        <div class="trip-info">
            <h2>📅 Trip Details</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Check-in Date</label>
                    <input type="date" id="checkin" value="2026-06-25">
                </div>
                <div class="form-group">
                    <label>Check-out Date</label>
                    <input type="date" id="checkout" value="2026-07-05">
                </div>
                <div class="form-group">
                    <label>Number of Nights</label>
                    <input type="number" id="nights" value="10" readonly>
                </div>
                <div class="form-group">
                    <label>Total Budget (EUR)</label>
                    <input type="number" id="budget" value="1500" min="0">
                </div>
            </div>
            <div class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Preferred Location</label>
                    <input type="text" id="location" value="Vourvourou, Chalkidiki" placeholder="e.g., Vourvourou, Chalkidiki">
                </div>
                <div class="form-group">
                    <label>Adults</label>
                    <input type="number" id="adults" value="2" min="1">
                </div>
                <div class="form-group">
                    <label>Children</label>
                    <input type="number" id="children" value="2" min="0">
                </div>
            </div>
            <button onclick="saveTripDetails()" style="margin-top: 15px;">💾 Save Trip Details</button>
        </div>

        <!-- Budget Summary -->
        <div id="budgetSummary" class="budget-summary" style="display: none;">
            <h2>💰 Budget Summary</h2>
            <div class="budget-info">
                <div class="budget-item">
                    <div class="budget-label">Total Budget</div>
                    <div class="budget-value" id="totalBudget">€1500</div>
                </div>
                <div class="budget-item">
                    <div class="budget-label">Cheapest Option</div>
                    <div class="budget-value" id="cheapestPrice">-</div>
                </div>
                <div class="budget-item">
                    <div class="budget-label">Budget Remaining</div>
                    <div class="budget-value" id="budgetRemaining">-</div>
                </div>
                <div class="budget-item">
                    <div class="budget-label">Status</div>
                    <div class="budget-value" id="budgetStatus" style="font-size: 1.3em;">-</div>
                </div>
            </div>
        </div>

        <!-- Add New Listing -->
        <div class="add-listing">
            <h2>➕ Add Listing to Track</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Property Name</label>
                    <input type="text" id="newListingName" placeholder="e.g., Beachfront Apartment in Vourvourou">
                </div>
                <div class="form-group">
                    <label>Platform</label>
                    <select id="newListingPlatform">
                        <option value="airbnb">Airbnb</option>
                        <option value="booking">Booking.com</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Initial Price (EUR)</label>
                    <input type="number" id="newListingPrice" placeholder="Total price for 10 nights" min="0" step="0.01">
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Listing URL</label>
                <input type="url" id="newListingUrl" placeholder="https://www.airbnb.com/rooms/...">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Notes (optional)</label>
                <textarea id="newListingNotes" rows="2" placeholder="e.g., 2 bedrooms, air conditioning, 50m from beach..."></textarea>
            </div>
            <button onclick="addListing()" style="margin-top: 15px;">➕ Add Listing</button>
        </div>

        <!-- Listings -->
        <div id="listingsContainer">
            <h2 style="color: #667eea; margin-bottom: 20px;">📊 Tracked Listings</h2>
            <div id="listingsList"></div>
        </div>

        <!-- Comparison Chart -->
        <div id="comparisonChart" style="display: none;">
            <h2 style="color: #667eea; margin-bottom: 20px;">📈 Price Comparison</h2>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let listings = [];
        let tripDetails = {
            checkin: '2026-06-25',
            checkout: '2026-07-05',
            nights: 10,
            budget: 1500,
            location: 'Vourvourou, Chalkidiki',
            adults: 2,
            children: 2
        };

        // Load data from localStorage on page load
        window.onload = function() {
            loadData();
            updateNights();
            renderListings();
            updateBudgetSummary();
        };

        // Calculate nights
        document.getElementById('checkin').addEventListener('change', updateNights);
        document.getElementById('checkout').addEventListener('change', updateNights);

        function updateNights() {
            const checkin = new Date(document.getElementById('checkin').value);
            const checkout = new Date(document.getElementById('checkout').value);
            const nights = Math.ceil((checkout - checkin) / (1000 * 60 * 60 * 24));
            document.getElementById('nights').value = nights > 0 ? nights : 0;
        }

        function saveTripDetails() {
            tripDetails = {
                checkin: document.getElementById('checkin').value,
                checkout: document.getElementById('checkout').value,
                nights: parseInt(document.getElementById('nights').value),
                budget: parseFloat(document.getElementById('budget').value),
                location: document.getElementById('location').value,
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value)
            };
            saveData();
            updateBudgetSummary();
            alert('✅ Trip details saved!');
        }

        function addListing() {
            const name = document.getElementById('newListingName').value.trim();
            const platform = document.getElementById('newListingPlatform').value;
            const price = parseFloat(document.getElementById('newListingPrice').value);
            const url = document.getElementById('newListingUrl').value.trim();
            const notes = document.getElementById('newListingNotes').value.trim();

            if (!name || !price || !url) {
                alert('⚠️ Please fill in property name, price, and URL');
                return;
            }

            const listing = {
                id: Date.now(),
                name: name,
                platform: platform,
                url: url,
                notes: notes,
                priceHistory: [{
                    price: price,
                    date: new Date().toISOString(),
                    timestamp: Date.now()
                }]
            };

            listings.push(listing);
            saveData();
            renderListings();
            updateBudgetSummary();

            // Clear form
            document.getElementById('newListingName').value = '';
            document.getElementById('newListingPrice').value = '';
            document.getElementById('newListingUrl').value = '';
            document.getElementById('newListingNotes').value = '';

            alert('✅ Listing added successfully!');
        }

        function addPrice(listingId) {
            const priceInput = document.getElementById(`price-${listingId}`);
            const price = parseFloat(priceInput.value);

            if (!price || price <= 0) {
                alert('⚠️ Please enter a valid price');
                return;
            }

            const listing = listings.find(l => l.id === listingId);
            if (listing) {
                listing.priceHistory.push({
                    price: price,
                    date: new Date().toISOString(),
                    timestamp: Date.now()
                });
                saveData();
                renderListings();
                updateBudgetSummary();
                priceInput.value = '';
            }
        }

        function deleteListing(listingId) {
            if (confirm('Are you sure you want to delete this listing?')) {
                listings = listings.filter(l => l.id !== listingId);
                saveData();
                renderListings();
                updateBudgetSummary();
            }
        }

        function renderListings() {
            const container = document.getElementById('listingsList');

            if (listings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 1.2em;">No listings yet!</p>
                        <p>Add your first listing above to start tracking prices.</p>
                    </div>
                `;
                document.getElementById('comparisonChart').style.display = 'none';
                return;
            }

            container.innerHTML = listings.map(listing => {
                const currentPrice = listing.priceHistory[listing.priceHistory.length - 1].price;
                const previousPrice = listing.priceHistory.length > 1
                    ? listing.priceHistory[listing.priceHistory.length - 2].price
                    : currentPrice;

                const priceChange = currentPrice - previousPrice;
                const priceChangePercent = previousPrice > 0 ? ((priceChange / previousPrice) * 100).toFixed(1) : 0;

                let priceChangeClass = 'price-same';
                let priceChangeText = 'No change';
                if (priceChange > 0) {
                    priceChangeClass = 'price-up';
                    priceChangeText = `↑ €${priceChange.toFixed(2)} (+${priceChangePercent}%)`;
                } else if (priceChange < 0) {
                    priceChangeClass = 'price-down';
                    priceChangeText = `↓ €${Math.abs(priceChange).toFixed(2)} (-${Math.abs(priceChangePercent)}%)`;
                }

                const isWithinBudget = currentPrice <= tripDetails.budget;
                const budgetIndicator = isWithinBudget ? '✅ Within budget' : '❌ Over budget';

                return `
                    <div class="listing-card">
                        <div class="listing-header">
                            <div class="listing-title">${listing.name}</div>
                            <span class="listing-platform platform-${listing.platform}">
                                ${listing.platform === 'airbnb' ? 'Airbnb' : 'Booking.com'}
                            </span>
                        </div>

                        ${listing.notes ? `<div class="listing-details">📝 ${listing.notes}</div>` : ''}

                        <div class="listing-details">
                            🔗 <a href="${listing.url}" target="_blank" class="listing-url">${listing.url}</a>
                        </div>

                        <div class="listing-details" style="font-weight: 600; color: ${isWithinBudget ? '#10b981' : '#ef4444'};">
                            ${budgetIndicator}
                        </div>

                        <div class="price-history">
                            <strong style="color: #333;">Price History (${listing.priceHistory.length} checks)</strong>
                            ${listing.priceHistory.slice().reverse().map((entry, index) => {
                                const date = new Date(entry.date);
                                const formattedDate = date.toLocaleDateString('en-US', {
                                    year: 'numeric', month: 'short', day: 'numeric',
                                    hour: '2-digit', minute: '2-digit'
                                });

                                let changeInfo = '';
                                if (index < listing.priceHistory.length - 1) {
                                    const prevEntry = listing.priceHistory[listing.priceHistory.length - index - 1];
                                    const diff = entry.price - prevEntry.price;
                                    if (diff > 0) {
                                        changeInfo = `<span class="price-change price-up">↑ €${diff.toFixed(2)}</span>`;
                                    } else if (diff < 0) {
                                        changeInfo = `<span class="price-change price-down">↓ €${Math.abs(diff).toFixed(2)}</span>`;
                                    }
                                }

                                return `
                                    <div class="price-entry">
                                        <div>
                                            <div class="price-value">€${entry.price.toFixed(2)}</div>
                                            <div style="font-size: 0.85em; color: #666;">${formattedDate}</div>
                                        </div>
                                        ${changeInfo}
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="add-price-form">
                            <input type="number" id="price-${listing.id}" placeholder="New price (EUR)" min="0" step="0.01">
                            <button onclick="addPrice(${listing.id})">Add Price Check</button>
                        </div>

                        <div class="listing-actions">
                            <button class="btn-danger" onclick="deleteListing(${listing.id})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');

            updateChart();
        }

        function updateChart() {
            if (listings.length === 0) {
                document.getElementById('comparisonChart').style.display = 'none';
                return;
            }

            document.getElementById('comparisonChart').style.display = 'block';

            const ctx = document.getElementById('priceChart').getContext('2d');

            // Destroy previous chart if it exists
            if (window.priceChart) {
                window.priceChart.destroy();
            }

            const datasets = listings.map((listing, index) => {
                const colors = ['#667eea', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
                const color = colors[index % colors.length];

                return {
                    label: listing.name,
                    data: listing.priceHistory.map(entry => ({
                        x: new Date(entry.date),
                        y: entry.price
                    })),
                    borderColor: color,
                    backgroundColor: color + '20',
                    tension: 0.4,
                    fill: false
                };
            });

            window.priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: 'Price Trends Over Time'
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Price (EUR)'
                            },
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function updateBudgetSummary() {
            if (listings.length === 0) {
                document.getElementById('budgetSummary').style.display = 'none';
                return;
            }

            document.getElementById('budgetSummary').style.display = 'block';

            const currentPrices = listings.map(l => l.priceHistory[l.priceHistory.length - 1].price);
            const cheapest = Math.min(...currentPrices);
            const remaining = tripDetails.budget - cheapest;
            const isOverBudget = cheapest > tripDetails.budget;

            document.getElementById('totalBudget').textContent = `€${tripDetails.budget.toFixed(2)}`;
            document.getElementById('cheapestPrice').textContent = `€${cheapest.toFixed(2)}`;
            document.getElementById('budgetRemaining').textContent = `€${remaining.toFixed(2)}`;

            const statusElement = document.getElementById('budgetStatus');
            if (isOverBudget) {
                statusElement.textContent = '❌ Over';
                statusElement.style.color = '#ef4444';
                document.querySelector('.budget-item:last-child').classList.add('over-budget');
            } else {
                statusElement.textContent = '✅ Good';
                statusElement.style.color = '#10b981';
                document.querySelector('.budget-item:last-child').classList.remove('over-budget');
            }
        }

        function saveData() {
            localStorage.setItem('vacationTracker', JSON.stringify({
                listings: listings,
                tripDetails: tripDetails
            }));
        }

        function loadData() {
            const data = localStorage.getItem('vacationTracker');
            if (data) {
                const parsed = JSON.parse(data);
                listings = parsed.listings || [];
                tripDetails = parsed.tripDetails || tripDetails;

                // Update form fields
                document.getElementById('checkin').value = tripDetails.checkin;
                document.getElementById('checkout').value = tripDetails.checkout;
                document.getElementById('nights').value = tripDetails.nights;
                document.getElementById('budget').value = tripDetails.budget;
                document.getElementById('location').value = tripDetails.location;
                document.getElementById('adults').value = tripDetails.adults;
                document.getElementById('children').value = tripDetails.children;
            }
        }
    </script>
</body>
</html>
